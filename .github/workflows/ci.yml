name: CI

on:
  push:
    # `main` is the default and the only development branch. `master` was the pre-rewrite line;
    # it was deleted 2026-09-05 and archived as tag archive/pre-rewrite-master-2026-09-02 (#3333),
    # so listing it here would gate a ref that cannot exist.
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  host-sanitizers:
    name: Host ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build
      - name: Build isolated host checks
        run: |
          mkdir -p prosper/build-sanitizers/tmpdir
          export TMPDIR="$PWD/prosper/build-sanitizers/tmpdir"
          cmake -S prosper/tools/doctor -B prosper/build-sanitizers -G Ninja \
            -DPROSPER_SANITIZER=address-undefined
          cmake --build prosper/build-sanitizers -j2
      - name: Verify host code and sanitizer positive controls
        run: ctest --test-dir prosper/build-sanitizers --no-tests=error --output-on-failure

  host-tsan:
    # DEBUGGING_WORKFLOWS.md states that BOTH sanitizer configurations must pass. The thread
    # configuration is the one that rots quietly -- its race control was already flaky under
    # optimization once -- so the claim is pinned here rather than left to local runs.
    name: Host TSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build
      - name: Build isolated host checks
        run: |
          mkdir -p prosper/build-tsan/tmpdir
          export TMPDIR="$PWD/prosper/build-tsan/tmpdir"
          cmake -S prosper/tools/doctor -B prosper/build-tsan -G Ninja \
            -DPROSPER_SANITIZER=thread
          cmake --build prosper/build-tsan -j2
      - name: Verify host code and race-detection positive control
        run: ctest --test-dir prosper/build-tsan --no-tests=error --output-on-failure

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # spirv-tools is what makes the `spv_validate` test a validation gate rather than a
      # recompile smoke test. It is on no GitHub runner image, and this workflow never installed
      # it, so that test reported "PASS (recompiled; spirv-val not found)" with status 0 on every
      # CI run it has ever had — while CLAUDE.md and both READMEs described prosper's shaders as
      # strictly spirv-val-gated. #1711 is what shipped through the gap. spv_validate now fails
      # when the validator is absent, so removing this line breaks the job instead of silently
      # switching the gate off again.
      # gdb is the same shape of gap, measured rather than assumed: the Ubuntu 24.04 runner image
      # ships gcc/g++/cmake but NOT gdb, so `hle_calls_value_capture` — the only guard on the #2075
      # class, a value capture that silently records nothing — reported
      # `10/250 Test #10: hle_calls_value_capture ***Skipped` on every CI run since it landed. That
      # skip is legible by design (SKIP_RETURN_CODE 77 names it in the summary) rather than silent,
      # which is why this is a one-line install and not a redesign: the test drives a real gdb over a
      # real no-debug-info binary because nothing else reproduces the defect.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libavformat-dev libavcodec-dev \
            libavutil-dev libswresample-dev libswscale-dev libva-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers spirv-tools gdb

      # #1675: Vulkan was disabled here because it was never installed, not by choice — and that
      # silently removed 27 tests (~1,700 assertions) from every "green" CI run, including every
      # shader-recompiler and GPU-execution differential. They are designed for a software device
      # (llvmpipe/lavapipe) and run in seconds locally, so CI can run them too.
      # The live runtime requires Vulkan 1.4; Ubuntu 24.04's headers/loader are 1.3.
      # Keep the distribution's Mesa ICD and validation layer for the existing test baseline.
      - name: Set up Vulkan 1.4
        uses: ./.github/actions/setup-vulkan

      - name: Configure
        run: cmake -S prosper -B prosper/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPROSPER_DIAGNOSTICS=ON

      # A configuration that quietly loses Vulkan would silently drop those tests again and still
      # report 100% green. Fail the job instead of shrinking the suite.
      # Guard the CLASS, not the instance: a configure that quietly loses Vulkan would drop the GPU
      # suite again and still report 100% green, which is precisely the defect #1675 documents.
      #
      # By NAME, not by count. A "at least N tests" floor rots silently — the suite only grows, so a
      # threshold that is meaningful today is passed by the non-GPU tests alone once enough are added,
      # and the guard stops guarding without ever failing. These three cannot exist unless Vulkan was
      # found, and they stay meaningful however large the suite gets.
      - name: Verify the Vulkan-gated tests are actually registered
        run: |
          for t in rdna2_to_spirv_exec gpu_execute vulkan_triangle_render game_compute_exec; do
            if ! ctest --test-dir prosper/build-ci -N -R "^${t}$" | grep -q "Test *#"; then
              echo "::error::${t} is not registered — the Vulkan-gated suite is missing (see #1675)"
              exit 1
            fi
          done
          echo "Vulkan-gated suite present; total registered: \
            $(ctest --test-dir prosper/build-ci -N | tail -1 | grep -oE '[0-9]+$')"

      # Same defect class as the guard above, different gate — and deliberately a SEPARATE step so
      # the error names the right cause. `vkprobe_hand_written_controls` is registered only when
      # both `spirv-as` and `spirv-val` are found; CMake says so with `message(STATUS ...)`, which
      # is honest and not load-bearing, because nothing fails when the case disappears.
      #
      # What is lost when it disappears is a CONTROL. `tools/vkprobe/shaders/` holds hand-written
      # SPIR-V whose entire value is being valid by construction: it does the same storage-buffer
      # loads as prosper's generated modules without being prosper's output, which is what let it
      # decide #2945. An unvalidated control is worse than no control, because it still reads as
      # one — the same shape as #1711, where a `spirv-val` gate reported PASS with no validator
      # present.
      #
      # What actually stays green is NARROWER than "the spirv-tools install is dropped", and the
      # distinction matters because the broad version makes this guard look redundant. Dropping the
      # whole package turns the job red anyway: `spv_validate` is registered unconditionally and
      # hard-fails when `spirv-val` is missing (tools/spv_validate/spv_validate.cpp:306-315 -- a
      # deliberate fix, since it once printed PASS with no validator). The cases this guard is the
      # only cover for are the ones that leave `spirv-val` present: `spirv-as` alone disappearing
      # or being renamed, `python3` absent, or the CMake gate itself being edited.
      - name: Verify the spirv-tools-gated control check is actually registered
        run: |
          if ! ctest --test-dir prosper/build-ci -N -R '^vkprobe_hand_written_controls$' | grep -q "Test *#"; then
            echo "::error::vkprobe_hand_written_controls is not registered — spirv-as/spirv-val were not found, so the hand-written SPIR-V controls in tools/vkprobe/shaders are unvalidated (see #2960)"
            exit 1
          fi

      - name: Build
        run: cmake --build prosper/build-ci

      # The runner has no GPU, so this is Mesa's lavapipe software rasteriser. Four tests were once
      # excluded here as "driver-divergent" (#1681). NONE of them were: every divergence was
      # measured, and each time it was prosper's own assertion or fixture that overreached.
      #   * recompiled_fragment_render (6) / recompiled_shaders_render (1) asserted rendered pixels
      #     from draws whose shaders require an exact 64-lane fragment subgroup. lavapipe is fixed at
      #     8, so the backend correctly skips those draws fail-visibly and the target keeps its clear
      #     colour. Neighbouring assertions in the same files already gated on that capability; these
      #     did not. Now gated — both run and pass here.
      #   * game_compute_exec's R11G11B10 sweep required bit-exact round-tripping over all 2048 f11
      #     codes, which includes the NaN encodings. Exactly 92 texels differ, all 92 carrying a
      #     signalling NaN and none all-finite: NaN payload quieting through the f16->f32 unpack,
      #     which no driver owes us. Narrowed to bit-exactness for every finite and infinite code
      #     plus NaN-ness for the rest; this runner now reports `nan-payload-only=92 real=0`.
      #   * game_compute_exec's last two failures (#1690) looked version-specific — they failed only
      #     on Mesa 25.2.8 and passed on Mesa 26.1.4 lavapipe and on RADV — but no driver was at
      #     fault. The test's `image_copy_3d` fixture prepared a third address register and called
      #     itself 3D while leaving MIMG.DIM at 2D, so the recompiler faithfully emitted a 2D SPIR-V
      #     image addressed by two coordinates while the backend bound the 3D view its 3D resource
      #     descriptor calls for. A 3D view bound to a descriptor whose shader declares Dim 2D is
      #     undefined in Vulkan: Mesa 26.1.4 and RADV returned the data anyway, Mesa 25.2.8 returned
      #     zero. Encoding DIM=3D makes the fixture exercise the 3D path it always claimed to, and it
      #     passes on all three. A standalone Vulkan probe — a 3D storage image seeded from a host
      #     buffer, partially written by a compute dispatch, read back, with no prosper code in the
      #     path — passes on Mesa 25.2.8, which is what ruled the driver out.
      #
      # The exclusion list is now EMPTY, and it should stay that way. Excluding a test by name here
      # drops it from every future green run and the loss is invisible in the result — #1675 lost 27
      # tests to exactly that for months. If a GPU test fails here, diagnose it: all four exclusions
      # that ever existed turned out to be an assertion or a fixture that overreached, and not one of
      # them turned out to be the driver.
      #
      # Reproduce the software-rasteriser path locally with:
      #   VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json ctest
      # To reproduce THIS runner's exact driver, note that the Mesa here comes from the Ubuntu
      # archive at run time rather than from a pin. It is currently 25.2.8, which both Ubuntu 24.04
      # and 25.10 carry, so a CPU-only container reproduces it without a GPU:
      #   podman run --rm -v "$PWD:/work" ubuntu:25.10   # mesa-vulkan-drivers 25.2.8
      - name: Test
        run: |
          # --no-tests=error on every ctest in this file. Plain ctest EXITS 0 when it finds no
          # tests at all, so "nothing ran" and "everything passed" are the same status and a job
          # gating on it reports a confident green having verified nothing (#2187). This job also
          # has the by-name registration guard above, which is the stronger check; the flag is
          # here so the protection does not depend on remembering which job carries which guard.
          ctest --test-dir prosper/build-ci --output-on-failure --timeout 600 --no-tests=error

      # A green run has to carry the NUMBERS, not just the verdict (#3067). The `timing-margin`
      # ctest label marks the tests whose pass rests on a MEASURED wall-clock margin and which print
      # that margin on stdout; `--output-on-failure` above discards it on exactly the runs where
      # nothing is wrong, so the headroom on either side of a near-miss is unrecoverable and the only
      # way to see the figure is to redden the job first. That is the #3208 defect -- a threshold
      # whose margin nobody has measured recently -- sitting one flag away from being measured on
      # every run. #3067 is what it cost: a red macOS job whose cause was printed in its own log
      # (`(timeout took 13.58 ms via none)` against a 12 ms ceiling) was filed as "unresolved, two
      # candidates" and stayed open for six days.
      #
      # Re-running the label is a few seconds -- the labelled tests are ~1.5 s each even under
      # Rosetta 2. It is a SECOND sample of an assertion the step above already gated on, so it is
      # left blocking on purpose: if a timing arm fails only on the re-run, that is a real second
      # observation and worth a red job, and `-V` says which arm and at what measured value.
      #
      # `-L` together with `--no-tests=error` is the self-checking half: if the label is renamed or
      # dropped, this step fails loudly instead of silently reporting nothing for ever after.
      - name: Report the measured wait margins
        run: ctest --test-dir prosper/build-ci -L timing-margin -V --no-tests=error

      # #1704: until this step existed, no Vulkan validation layer ran anywhere in the project.
      # #1690 was an invalid descriptor binding — a VK_IMAGE_VIEW_TYPE_3D view on a descriptor whose
      # module declared Dim 2D — which is undefined behaviour that three conformant drivers resolved
      # three different ways. It read as a Mesa version regression, cost a session of bisection and
      # 484 executed assertions' place on this job, and the layer names it in one line at the
      # dispatch (VUID-vkCmdDispatch-viewType-07752). Verified against that exact defect: reverting
      # image_copy_3d's MIMG.DIM to 2D on a scratch branch makes this step fail with that VUID.
      #
      # It is a GATE, not an advisory collector. Every message id that existed when it was switched
      # on is itemised in tools/vkval/allowlist.txt with a reason and an open issue (#1710-#1717);
      # anything else fails the job, as does any test that fails under the layer but passes without
      # it. The scanner refuses to report "clean" until it has watched the loader insert the layer,
      # because a layer that did not load produces exactly the same empty output as a clean run —
      # and it also fails if the allow-list is non-empty while ZERO messages were observed, which is
      # what a parser that no longer matches this runner's layer version looks like. That is not
      # hypothetical: the first revision of the parser read 0 of the 187 messages produced here,
      # because layers 1.3.275 frame a message differently from 1.4.341.
      #
      # Measured cost on this runner: ctest reports 30.46 s without the layer and 31.08 s with it,
      # so this step is ~31 s of wall clock. The layer package lives in noble/universe.
      - name: Vulkan validation scan
        run: |
          python3 prosper/tools/vkval/vk_validation_scan.py --build-dir prosper/build-ci

  contribution-shape:
    name: Contribution shape
    runs-on: ubuntu-latest
    steps:
      # Its own job, like Docs and for the same reason: it needs nothing built, finishes in seconds,
      # and a false positive here must not cost the build-and-test signal from an unrelated job.
      #
      # It answers two questions no other job in this pipeline can, because both are about what a
      # PR ADDS rather than about what the build produces:
      #
      #   1. Did this PR add a file OUTSIDE the build tree? Every job here builds prosper, and
      #      prosper globs `prosper/src/*.cpp`. A file added at the repository root is compiled by
      #      nothing -- so every job goes green while certifying the absence of the code rather than
      #      its correctness. Measured on #2507-#2510 (2026-08-12): 4,541 added lines in six headers
      #      at the repository root, three PRs reporting 8 SUCCESS, and not one line compiled by any
      #      job. Instrument-trap 151's family, one level further out.
      #
      #   2. Did this PR add a new source file and touch no test at all? A new .cpp is picked up
      #      automatically by the CONFIGURE_DEPENDS glob, so it can arrive fully built and entirely
      #      unexercised -- the #2492 shape, where "it compiles" was the only checkable claim.
      #
      # fetch-depth: 0 because the check is a diff against the base branch, and a shallow clone has
      # no merge base to diff against.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs before the check itself: the selftest holds hand-written violating AND compliant inputs,
      # so a gate that has silently stopped discriminating fails here rather than passing everything
      # downstream. A checker that cannot show it still fires is indistinguishable from one that was
      # disabled.
      - name: Verify the checker still discriminates
        run: python3 prosper/tools/ci/check_contribution_shape.py --selftest

      - name: Check the contribution shape of this PR
        if: github.event_name == 'pull_request'
        run: |
          # No --depth here: `fetch-depth: 0` above already fetched full history, and
          # `--depth=0` is rejected outright (`fatal: depth 0 is not a positive number`) --
          # which is how this job failed on its own first run.
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 prosper/tools/ci/check_contribution_shape.py --github \
            --base "origin/${{ github.base_ref }}"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    # No `issues: read` here any more, and that is deliberate rather than an oversight: it existed
    # solely for the PROGRESS_TRACKER.md staleness check, which now lives in `progress-tracker`.
    # Every remaining step in this job is local and offline, so the grant would be dead -- and a
    # permission justified by a comment describing a step that no longer exists is exactly the kind
    # of stale claim these gates are here to prevent.
    permissions:
      contents: read
    steps:
      - name: Checkout
        # fetch-depth: 2 is LOAD-BEARING, not tidiness. The numbering gate's deleted-row check
        # needs the base's copy of the file, and reads it as `HEAD^1` -- which is the base commit
        # on a `pull_request` merge ref and the previous master on a push. At the default depth 1
        # the parent is not fetched, `git show HEAD^1:<file>` fails, and the step below fails with
        # it (deliberately: a baseline that cannot be produced must not degrade to a green run).
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Its own job rather than a step of Linux: a false positive here must not cost the build and
      # test signal from an unrelated job. It needs nothing built and finishes in seconds.
      #
      # The instrument-trap table is the page the working guide points agents at first, and several
      # lanes append to it concurrently. Two defects landed in it on 2026-08-01 that NO other check
      # in this pipeline could see:
      #   * A stray blank line between two rows. Markdown ends a table at a blank line, so the rows
      #     after it silently render as a SEPARATE table. Master carried two at once, rendering 36
      #     rows as three tables with the newest entry orphaned in a one-row table of its own.
      #     Nothing is missing from the file, so the diff looks perfect.
      #   * Two branches claiming the same row number. These merge CLEANLY -- separate lines, no
      #     textual conflict -- producing a table reading "33, 34, 35, 32" at mergeable=CLEAN with
      #     every job green. Conflict detection is line-local and has no idea the column is a key,
      #     and other documents cite these rows BY NUMBER, so a duplicate silently redirects them.
      #
      # --ordered is opt-in and belongs only to this table, whose convention is "append, never
      # renumber". RE-MEASURED under this rule rather than inherited from --sequential's, because
      # relaxing gaplessness can only raise the count: over the 101 tracked Markdown files, all 101
      # pass the structure check, while of the 10 documents holding an all-numeric-first-column
      # table only 6 satisfy order -- the rest lead with frame indices, draw ordinals and submit
      # numbers, where repeats are the correct content. Applying order broadly would report correct
      # documents as broken, and a check that fires on correct data gets deleted.
      #
      # --ordered replaced --sequential on 2026-08-17 (#2089). GAPS ARE NOW LEGAL. Gaplessness made
      # a lane's job red BY CONSTRUCTION whenever a lower number was still in flight -- a failure
      # its author could not repair, because the missing number belonged to somebody else's branch,
      # and the only local fix was the forbidden renumber. It was kept because it catches a DELETED
      # row, but it only ever caught an INTERIOR deletion: measured on master's 186-row Instrument
      # table, dropping the highest row passed green, and restoring the file wholesale from an old
      # revision (instrument trap 41 / #1701) lost 61 rows and reported "contiguous and unbroken".
      #
      # --baseline is what took that job over, and it is the whole detector: every row number in
      # the base's copy of the table must still be present, so an interior deletion, a truncated
      # tail, a whole-file revert and a renumber are all reported -- and nothing another lane does
      # can make it fire. HEAD^1 is the base commit on a pull_request merge ref (checkout with no
      # `ref:` checks out refs/pull/N/merge, whose first parent is the base) and the previous master
      # on a push, so the same expression is right for both the pre-merge and the post-merge run.
      - name: Verify the numbered doc tables are intact
        run: |
          set -o pipefail
          F=prosper/docs/GAME_COMPAT_ORCHESTRATION.md
          git show "HEAD^1:$F" > "$RUNNER_TEMP/orchestration-base.md"
          python3 prosper/tools/docs/check_numbered_table.py --github --ordered \
            --table-header Instrument --baseline "$RUNNER_TEMP/orchestration-base.md" "$F"

      # Structure and cell ARITY, across every tracked Markdown file: catches the same
      # table-splitting defect anywhere it appears, plus a third class no gate here could see
      # before (#2108). GFM splits a row into cells on `|` BEFORE parsing inline content, so a pipe
      # inside an inline code span is a cell boundary and the excess cells are SILENTLY DISCARDED
      # on the rendered page. Six rows of the instrument-trap table were truncated this way for
      # months -- including trap 40, whose subject is `cmd | tail` and which was broken by writing
      # exactly that unescaped -- while the step above reported the file `unbroken`, because it
      # validates numbering contiguity and never cell counts. The fix per row is one character,
      # `\|`. Documents with no table at all are ordinary here and are not an error.
      - name: Verify no Markdown table is split or mis-sized anywhere in docs
        run: |
          git ls-files '*.md' -z | xargs -0 python3 prosper/tools/docs/check_numbered_table.py --github

      # Committed imagery, not prose, but this is the cheap job that already has Python and needs no
      # build. Measured 2026-09-02: `assets/screenshots` was 398 MiB of a 621 MiB pack while ALL
      # source, docs and tests in the entire history came to 18 MiB -- images were ~96% of the
      # repository, and the cause was resolution rather than count (121 files averaging 2.5 MiB, all
      # 3840x2160 PNG). Re-encoding took them to 14.2 MiB. Without a gate this drifts straight back:
      # the capture tools emit 4K PNG, so committing one is the path of least resistance and nothing
      # would notice until the repository was large again.
      #
      # The check is `--check`, which re-encodes to memory and exits 1 if any file WOULD change. It
      # skips a file that is already WebP and within the width cap, so a conforming tree goes green
      # -- a gate that always reports work to do is one nobody can satisfy, and would be turned off.
      - name: Verify committed screenshots are within the size convention
        run: |
          python3 -m pip install --quiet Pillow
          # BOTH image trees. `prosper/docs/screenshots` was missed by the first pass and was
          # still 53 MB of 1080p PNG (3-5.6 MiB each) with nothing watching it -- a gate that
          # covers one of two directories is how the second one grows back.
          python3 prosper/tools/screenshots/shrink.py --check \
            assets/screenshots prosper/docs/screenshots

      # The other half of the numbering contract, and until now nobody checked it. The table's value
      # is that other files point AT it by number, and roughly half of those references are
      # .cpp/.hpp/.py COMMENTS rather than prose -- the step prints the live counts, so no figure is
      # frozen here to go stale. `check_numbered_table.py`
      # validates the table and has no idea anything cites it, so a reference to a row that never
      # existed reads as perfectly correct: a plausible number in a plausible sentence, findable only
      # by opening the table and counting, which nobody does for a number in a code comment.
      #
      # It scans every tracked file, so it is deliberately narrow about what counts as a reference --
      # `s_trap 1` in the shader tests is an RDNA2 mnemonic and is excluded by a leading boundary,
      # measured rather than assumed: without it the corpus admits 4 extra matches, 3 of which cite
      # row 0 and would turn this gate red on correct code. The TRAILING boundary is `(?!\w|\.\d)`
      # rather than the obvious `(?![\w.])`, which also rejects a full stop and so silently stopped
      # seeing every sentence-final citation -- 22 of 118, while still reporting "all resolving".
      - name: Verify every by-number trap reference resolves
        run: |
          git ls-files -z | xargs -0 python3 prosper/tools/docs/check_trap_citations.py --github \
            --table prosper/docs/GAME_COMPAT_ORCHESTRATION.md

      # Lives here, in the job that needs nothing built, for the same reason the checks above do:
      # it is a repository-wide text scan that finishes in a second. It gates the flag that keeps
      # the OTHER jobs' ctest steps honest -- plain ctest exits 0 on an empty suite, so a job
      # reading only that status can report a green suite having run nothing (#2187). Four jobs in
      # this file and both author-verification runs were exposed; they now pass --no-tests=error,
      # and this step is what stops the next one from omitting it.
      #
      # --selftest first, deliberately: the scan's own failure mode is silence. A matcher that
      # stops matching reports a clean tree forever, and this checker's first revision was 91%
      # false positives, so its matching is the part that needs a guard. The two run as separate
      # commands rather than a pipeline, because a pipeline's exit status is its LAST stage's.
      - name: Verify every ctest invocation fails on an empty suite
        run: |
          python3 prosper/tools/ci/check_ctest_gate.py --selftest
          python3 prosper/tools/ci/check_ctest_gate.py --root .

      # Same job, same reason: a repository-wide text scan needing nothing built. A diagnostic
      # whose PRODUCER is armed by a different switch than its PRINTER reports unarmed state as a
      # confident, well-formed ZERO, and a zero in these fields is usually what the interesting
      # hypothesis predicts -- so it lands in a `## Ruled out` row as a MEASUREMENT. #2111's
      # instrument emitted 183 negatives it had no capacity to falsify; three more instances landed
      # in one session (#2149). The failure is silent, survives review, and looks like rigour.
      #
      # The scan fails on a finding missing from tools/env/diag_gate_baseline.txt (a newly
      # introduced split gate) and on a baseline row that no longer reproduces (the fix landed --
      # delete the row). --selftest runs first and separately, not piped: a pipeline's exit status
      # is its last stage's, and this scanner's own failure mode is a signature that quietly stops
      # matching and reports a clean tree forever.
      - name: Verify no diagnostic prints a field a different switch had to measure
        run: |
          python3 prosper/tools/env/check_diag_gates.py --selftest
          python3 prosper/tools/env/check_diag_gates.py prosper

      # Same job, same reason again: a repository-wide text scan needing nothing built -- and here
      # the "needing nothing built" part is the point, because the defect this catches is visible
      # ONLY on Windows and would otherwise wait for the MinGW job. stdout carries bytes, and the
      # reader decodes them by platform: UTF-8 on Linux, the cp1252/cp437 console code page on
      # Windows. One em dash in a printf literal therefore reaches a Windows user as mojibake, so
      # `grep` for the line the tool itself printed does not match it -- fatal for a tool whose
      # documented recipe is `--import-slots | grep <name>`. #2579 shipped five that way: Linux CI
      # green, the Windows MinGW job red on the one assertion whose substring spanned one (#2588).
      #
      # It is also registered as the `ascii_output_literals` ctest so a local run catches it before
      # a push; the duplicate second is worth the seconds this job saves over waiting for a build.
      # Comments and Markdown keep their punctuation -- the rule is about the bytes the program
      # emits, and comments are stripped before literals are extracted.
      - name: Verify every string literal a program can print is ASCII
        run: |
          python3 prosper/tools/output/check_ascii_output.py prosper

      # PROGRESS_TRACKER.md is GENERATED from the `tracker:game` issues, and this is what stops it
      # becoming the third hand-maintained copy of the per-title status -- which is precisely the
      # drift #2730 documents, where nine trackers asserted a hardware-oracle comparison that had
      # never happened and it took a scan of 6,224 issue comments to establish that.
      #
      # --selftest first and SEPARATELY (not piped -- a pipeline's exit status is its last stage's),
      # for the reason every other gate in this job does it: this tool's own failure mode is
      # silence. A parser whose regexes quietly widened would accept anything and emit a plausible
      # wrong file. The selftest holds hand-written compliant AND violating trackers and asserts
      # both verdicts, so a gate that has stopped discriminating fails here rather than certifying
      # everything downstream. It needs no network, which is why it stays HERE as a gate even though
      # the live regeneration it used to guard has moved to the `progress-tracker` job: a generator
      # that has stopped discriminating must fail a build, and unlike staleness that IS something a
      # PR author can fix.
      - name: Verify the progress-tracker generator still discriminates
        run: python3 prosper/tools/docs/gen_progress_tracker.py --selftest

      # The live half used to follow here. It re-read the trackers through `gh` and failed the build
      # if the committed file no longer matched them; it now runs in the `progress-tracker` job on
      # main, which regenerates rather than failing FOR STALENESS -- it still fails on a generator
      # or tracker error. So THIS job is entirely local and offline, and
      # needs no token at all.
      #
      # Its rationale is kept here because the reasoning is what matters, not the step. Its
      # rationale was that the author can always repair a stale file in one command -- true for the
      # case it was written for (someone edits a tracker mid-flight), and false for the case that
      # actually broke main most often: the staleness is caused by THE MERGE ITSELF. A PR that
      # closes an issue the file cites is green on its own branch and turns main red the instant
      # it lands, because the correct content does not exist until after the merge. No commit the
      # author could have written would have satisfied it.
      #
      # Measured before removing it: 5 of the 7 Docs failures in the last 60 master runs were this
      # step. The file is regenerated by the `progress-tracker` job below instead -- the trackers
      # are authoritative and this file is derived, so main repairs it rather than asking a human
      # to. What is given up is that a PR is no longer TOLD its merge will change the file; that is
      # the intended trade, since being told did not let the author do anything about it.

  progress-tracker:
    name: Progress tracker
    runs-on: ubuntu-latest
    # Master only. PROGRESS_TRACKER.md is generated from the tracker ISSUES, which live outside this
    # repository, so it can go stale with no commit at all -- and a merge that closes a cited issue
    # makes it stale at the moment of merging, which no pre-merge check can repair. Master therefore
    # regenerates it instead of failing -- for THAT cause. A generator or tracker error still fails
    # here, because it is author-fixable and leaves the file frozen if swallowed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        # fetch-depth: 0, unlike the `docs` job's 2, because this job PUSHES: GitHub rejects a push
        # built on a shallow history ("shallow update not allowed").
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Push contention is SOFT -- a derived file one commit behind is not worth a red main, and
      # that is precisely the defect this job removes. A GENERATOR or TRACKER error is HARD, because
      # it writes no file and would otherwise freeze PROGRESS_TRACKER.md behind a permanently green
      # job; that one is author-fixable, which is the same criterion that keeps --selftest a gate.
      #
      # The second `exit 1` below is neither: it is a defensive assert on a state that should be
      # unreachable (a commit failing with a change staged). An earlier version of this comment
      # called both "causes an author can act on", which over-generalised the rule to cover it.
      #
      # A push made with GITHUB_TOKEN does not trigger workflows, so committing here cannot loop.
      - name: Regenerate PROGRESS_TRACKER.md from the trackers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # A GENERATOR failure is NOT contention and must not be swallowed. The tool hard-fails on
            # an unparseable tracker body, a zero-issue fetch, and an unresolvable citation, writing
            # NO file in each case -- and the first of those is author-fixable, which is the exact
            # criterion used to keep --selftest a hard gate. Swallowing it would freeze the file
            # indefinitely behind an always-green job, which is a worse version of the drift this
            # whole job exists to stop. --selftest cannot cover these: it is offline and fixture-fed.
            python3 prosper/tools/docs/gen_progress_tracker.py || {
              echo "::error::gen_progress_tracker.py failed -- this is a generator or tracker error,"
              echo "::error::not push contention, and it leaves PROGRESS_TRACKER.md frozen. Fix the"
              echo "::error::tracker it names, or the generator. Note the repair is usually an ISSUE"
              echo "::error::edit rather than a commit, so it may need no push from anyone at all --"
              echo "::error::the next main push then regenerates cleanly."
              exit 1
            }
            if git diff --quiet -- PROGRESS_TRACKER.md; then
              echo "PROGRESS_TRACKER.md already matches the trackers."
              exit 0
            fi
            git add PROGRESS_TRACKER.md
            # Checked: an unexpectedly empty commit would otherwise make the push a silent no-op
            # that still reports success below.
            git commit -m "docs: regenerate PROGRESS_TRACKER.md from the trackers" || {
              echo "::error::commit failed with a staged change present"
              exit 1
            }
            if git push origin HEAD:main; then
              echo "regenerated and pushed."
              exit 0
            fi
            # Another lane landed while we were generating. Rebuild on top of it and try again --
            # regenerating rather than replaying our commit, so the result reflects the new main.
            #
            # The reset is LOAD-BEARING, not tidiness: without it `pull --rebase` carries the local
            # commit forward, the next regeneration then finds no diff, and the loop takes the
            # "already matches" exit 0 having committed locally and never pushed. Do not simplify.
            echo "push rejected (attempt ${attempt}); rebasing onto the current main"
            git reset --hard HEAD~1
            git pull --rebase --quiet origin main || break
          done
          echo "::warning::could not push the regenerated PROGRESS_TRACKER.md after 3 attempts;"
          echo "::warning::the next push to main will regenerate it"
          exit 0

  linux-app:
    name: Linux App
    runs-on: ubuntu-latest

    # Builds the desktop frontend (prosper-app) with the SDL3 audio + gamepad frontends and Vulkan,
    # so the windowing/present/boot glue and the frontends stay compiling. Build-only: the app opens a
    # window and needs a display, so it isn't run here (the headless core is covered by the `linux` job).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # Vulkan (loader + FindVulkan) for the renderer; Wayland/X11 dev libs so the fetched SDL3
        # builds its video backends; PulseAudio/ALSA for the SDL3 audio backend. SDL3 itself is
        # fetched + built by CMake (FetchContent), so no libsdl package is needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libvulkan-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev \
            libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libpulse-dev libasound2-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libva-dev

      # The live runtime requires Vulkan 1.4; Ubuntu 24.04's headers/loader are 1.3.
      # Keep the distribution's Mesa ICD and validation layer for the existing test baseline.
      - name: Set up Vulkan 1.4
        uses: ./.github/actions/setup-vulkan

      - name: Configure
        run: cmake -S prosper -B prosper/build-app -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPROSPER_APP=ON -DPROSPER_AUDIO_SDL3=ON -DPROSPER_PAD_SDL3=ON

      - name: Build prosper-app
        # Building this target also builds its deps: prosper_core, prosper_live_renderer, SDL3, and
        # the prosper_audio_sdl3 / prosper_pad_sdl3 frontends.
        run: cmake --build prosper/build-app --target prosper-app

  linux-app-package:
    name: Linux App Package
    # PINNED, deliberately not ubuntu-latest. No AppImage bundles libc, so this runner's glibc is
    # the minimum every user of the published artifact must have, and `ubuntu-latest` silently
    # follows the newest image -- it would raise that floor on some future Tuesday with no diff and
    # no failing check. ubuntu-22.04 would give a lower floor (2.35), but the Ubuntu 22 images begin
    # brownout-based deprecation on 2026-09-17 and are unsupported from 2027-04-17, so pinning them
    # buys six weeks and then starts failing builds. 24.04 is the oldest runner that is not about to
    # break; verify-linux-app.sh asserts the resulting floor (2.39) so it cannot drift silently.
    runs-on: ubuntu-24.04

    # Separate from `Linux App` on purpose. That job stays Debug and build-only, which is the cheap
    # compile signal for the frontends; this one is the release path -- Release build, real
    # packaging, and the artifact checks. Losing either would be invisible in the other's result.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # The build set is identical to the Linux App job: the packaged binary must be the one that
        # job compiles, not a differently-configured build that happens to be easier to bundle.
        # The last line is the packaging set -- desktop-file-utils because appimagetool validates the
        # .desktop entry, file and binutils because the verification reads the artifacts back.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libvulkan-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev \
            libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libpulse-dev libasound2-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libva-dev \
            desktop-file-utils file binutils

      # The live runtime requires Vulkan 1.4; Ubuntu 24.04's headers/loader are 1.3.
      # Keep the distribution's Mesa ICD and validation layer for the existing test baseline.
      - name: Set up Vulkan 1.4
        uses: ./.github/actions/setup-vulkan

      - name: Configure
        run: >-
          cmake -S prosper -B prosper/build-release-app -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPROSPER_APP=ON
          -DPROSPER_AUDIO_SDL3=ON
          -DPROSPER_PAD_SDL3=ON

      - name: Build prosper-app
        run: cmake --build prosper/build-release-app --target prosper-app

      # Packaging runs on EVERY pull request, not only on tags. #1462 removed the Windows
      # package+upload from PRs because `actions/upload-artifact` hung and blocked a merge; the
      # problem there was the upload, not the packaging. Only the upload below is gated, so the
      # release path is exercised continuously while ordinary PRs still produce no artifacts.
      - name: Package Linux app
        # A block scalar, not a folded one: the two BUILD.txt lines must stay two lines.
        run: |
          info="commit: ${{ github.sha }}
          workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          prosper/packaging/linux/package-linux-app.sh \
            --build-dir prosper/build-release-app \
            --out-dir "$RUNNER_TEMP/linux-release" \
            --build-info "$info"

      # The gate that makes the step above worth running on PRs: the archives are extracted and the
      # packaged binary is executed, so "the release archive does not start" fails here instead of
      # in a user's download.
      - name: Verify Linux release artifacts
        run: >-
          prosper/packaging/linux/verify-linux-app.sh
          --out-dir "$RUNNER_TEMP/linux-release"
          --max-glibc 2.39

      # Archives leave the runner only for a release tag. Pull requests still build, package, and
      # execute the archives above, but never upload them (#1803).
      - name: Upload Linux archives
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: prosper-linux-x86_64
          path: |
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.AppImage
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.AppImage.sha256
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.tar.gz
            ${{ runner.temp }}/linux-release/prosper-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows-mingw:
    name: Windows MinGW
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # spirv-tools: the `spv_validate` test runs on every platform and requires spirv-val
          # (see the Linux job's dependency note).
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-spirv-tools

      - name: Configure
        shell: msys2 {0}
        run: cmake -S prosper -B prosper/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE -DPROSPER_DIAGNOSTICS=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build prosper/build-ci

      - name: Test
        shell: msys2 {0}
        # See the linux job: plain ctest exits 0 on an empty suite (#2187).
        run: ctest --test-dir prosper/build-ci --output-on-failure --timeout 600 --no-tests=error

      # Same measured-margin report as the Linux job -- see the long note there (#3067/#3208).
      - name: Report the measured wait margins
        shell: msys2 {0}
        run: ctest --test-dir prosper/build-ci -L timing-margin -V --no-tests=error

  windows-app:
    name: Windows App
    runs-on: windows-latest

    # Build-only for the Vulkan window itself: hosted Windows runners do not expose a reliable GPU
    # or interactive desktop. The SDL audio/pad seams still run through their dummy-driver tests.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader

      - name: Configure frontend
        shell: msys2 {0}
        run: >-
          cmake -S prosper -B prosper/build-windows-app -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPROSPER_APP=ON
          -DPROSPER_AUDIO_SDL3=ON
          -DPROSPER_PAD_SDL3=ON

      - name: Build frontend and seam tests
        shell: msys2 {0}
        run: >-
          cmake --build prosper/build-windows-app
          --target prosper-app test_prosper_app_pad_overlay test_audio_sdl3 test_pad_sdl3

      # Separate step, and deliberately NOT folded into the target list above: prosper-app does not
      # depend on boot_trace, and naming it in the app build would make this job cover something its
      # name does not claim. What it IS here for: this is the only Windows job that installs the
      # Vulkan headers and loader, so it is the only one where PROSPER_HAVE_VULKAN gets defined
      # (CMakeLists.txt sets it only when Vulkan is found). windows-mingw builds the whole tree but
      # passes -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE, so every Vulkan-gated block is preprocessed
      # away there.
      #
      # That split is how #3014 survived a fortnight: boot_trace.cpp called POSIX setenv inside its
      # PROSPER_HAVE_VULKAN block, so the job that builds the target never compiled the code and the
      # job that would compile the code never built the target. Neither was red. Any Windows tool with
      # Vulkan-gated code needs a line here, or it is uncompiled on this platform.
      - name: Build Windows tools that only compile with Vulkan enabled
        shell: msys2 {0}
        run: >-
          cmake --build prosper/build-windows-app
          --target boot_trace


      # See the linux job (#2187) for --no-tests=error. This job is the one it matters most for:
      # it is the only job testing a directory other than build-ci, so a --test-dir that drifted
      # back to the common name would find an absent or unbuilt tree, register nothing, and pass.
      #
      # It is ALSO the only job that runs ctest against a core built with PROSPER_DIAGNOSTICS at
      # its default (OFF). linux, windows-mingw and macos all pass -DPROSPER_DIAGNOSTICS=ON, so
      # diagnostics_disabled_stubs executes here and nowhere else -- this job is what keeps the
      # configuration users actually get from going untested. That dependency is invisible from
      # this file's own text, which is why it is written down: adding the flag here to make the
      # jobs 'consistent' would silently delete the last coverage of the default build. Raised in
      # review on #2496.
      # The comment lives out here rather than inside the block below because `run: >-` is a
      # FOLDED scalar: every line is joined into ONE command, so a `#` line would comment out the
      # rest of it -- which is exactly what a first attempt at this edit did.
      - name: Test SDL audio and input seams
        shell: msys2 {0}
        run: >-
          ctest --test-dir prosper/build-windows-app --output-on-failure --timeout 600
          --no-tests=error
          -R '^(prosper_app_pad_overlay|audio_sdl3|pad_sdl3)$'

      - name: Verify portable runtime imports
        shell: msys2 {0}
        run: |
          deps="$(objdump -p prosper/build-windows-app/prosper-app.exe | sed -n 's/.*DLL Name: //p')"
          printf '%s\n' "$deps"
          if grep -Eiq 'lib(gcc|stdc\+\+|winpthread)|SDL3' <<<"$deps"; then
            echo 'prosper-app unexpectedly depends on a MinGW or SDL runtime DLL' >&2
            exit 1
          fi

      - name: Package Windows app
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'prosper-windows-x64'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'prosper-windows-x64.zip'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'prosper/build-windows-app/prosper-app.exe' $stage
          Copy-Item 'prosper/scripts/start-prosper.ps1' $stage
          Copy-Item 'prosper/docs/WINDOWS_RELEASE.md' (Join-Path $stage 'README.md')
          @(
            'prosper Windows x64'
            "commit: $env:GITHUB_SHA"
            "workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content (Join-Path $stage 'BUILD.txt') -Encoding ascii
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  prosper-windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Upload Windows app
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: prosper-windows-x64
          path: |
            prosper-windows-x64.zip
            prosper-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (x86_64 / Rosetta 2)
    runs-on: macos-latest

    # GitHub's macos-latest runners are Apple Silicon (arm64). prosper has no ARM CPU backend — it
    # runs the guest's x86-64 code natively — so the whole app is built x86_64 (CMAKE_OSX_ARCHITECTURES)
    # and its tests run under Rosetta 2, exactly the supported macOS configuration (see docs/PORTING.md).
    # This exercises the Darwin guest-execution substrate (src/host/platform/posix_shim.hpp), not just a compile.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # Rosetta 2 is not preinstalled on arm64 runners; it's needed to RUN the x86_64 ctest binaries
        # (building them is a normal cross-arch target and needs no translation).
        # spirv-tools: the `spv_validate` test runs on every platform and requires spirv-val (see
        # the Linux job's dependency note). The validator is invoked as a subprocess, so the
        # native arm64 build serves the x86_64 test binaries fine.
        run: |
          brew install ninja spirv-tools
          softwareupdate --install-rosetta --agree-to-license

      - name: Configure
        # Vulkan is disabled (Homebrew's loader is arm64-only; the headless core + substrate tests
        # don't need it — MoltenVK is a later frontier). x86_64 target, run under Rosetta.
        run: cmake -S prosper -B prosper/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE -DPROSPER_DIAGNOSTICS=ON

      - name: Build
        run: cmake --build prosper/build-ci

      - name: Test
        # See the linux job: plain ctest exits 0 on an empty suite (#2187). This job configures
        # with -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=TRUE, so its suite is DELIBERATELY the smaller
        # non-GPU one -- which is exactly why a by-name Vulkan guard cannot be copied here and
        # why the empty case has to be caught by the flag instead.
        run: ctest --test-dir prosper/build-ci --output-on-failure --timeout 600 --no-tests=error

      # Same measured-margin report as the Linux job -- see the long note there (#3067/#3208).
      - name: Report the measured wait margins
        run: ctest --test-dir prosper/build-ci -L timing-margin -V --no-tests=error

  macos-app:
    name: macOS App (SDL3 + MoltenVK)
    runs-on: macos-latest

    # Builds the realtime window frontend (prosper-app) x86_64 against a UNIVERSAL MoltenVK, so the
    # SDL3-window/MoltenVK-present glue and the frontends stay compiling on a real macOS toolchain.
    # Build-only: the window needs a display and headless Metal is flaky on CI runners, so it isn't
    # run here (locally on an M2, --test-pattern presents fine and the offscreen GPU tests pass 90/91
    # -- see docs/PORTING.md "The macOS harness app"). Mirrors the Linux App job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ninja vulkan-headers
          softwareupdate --install-rosetta --agree-to-license

      - name: Fetch universal MoltenVK
        # Homebrew's MoltenVK is arm64-only; the x86_64 app needs a universal driver.
        run: bash prosper/scripts/fetch-macos-vulkan.sh

      - name: Configure
        run: cmake -S prosper -B prosper/build-app -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_ARCHITECTURES=x86_64 -DPROSPER_APP=ON -DPROSPER_AUDIO_SDL3=ON -DPROSPER_PAD_SDL3=ON -DPROSPER_MACOS_MOLTENVK=${{ github.workspace }}/.macos-vulkan/lib/libMoltenVK.dylib

      - name: Build prosper-app
        run: cmake --build prosper/build-app --target prosper-app

  release:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-app, linux-app-package, windows-mingw, windows-app, macos, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: prosper-windows-x64
          path: release-assets

      # Same directory as the Windows assets: the publish step below uploads release-assets/*, so a
      # platform is released exactly when its archives land here.
      - name: Download Linux archives
        uses: actions/download-artifact@v4
        with:
          name: prosper-linux-x86_64
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "prosper $GITHUB_REF_NAME"
          fi
